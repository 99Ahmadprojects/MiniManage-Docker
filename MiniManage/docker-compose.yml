services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minimanage-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:5000
    networks:
      - minimanage-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minimanage-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /app/db/items.db
      NODE_ENV: production
    volumes:
      - ./db:/app/db
    networks:
      - minimanage-network

networks:
  minimanage-network:
    driver: bridge
